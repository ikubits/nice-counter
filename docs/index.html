<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=1">
    <title>Docs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="flex flex-col min-h-screen bg-gray-50">
    <div class="content flex flex-col items-center justify-center mx-auto text-center" style="margin-top: 20vh;">

      <h2 class="text-xl font-medium">Static Text</h2>
      <span
        class="number text-6xl font-sacramento"
        id="static"
      >123 456 789.12</span>

      <h2 class="text-xl font-medium">Counter with manual control</h2>
      <nice-counter
        class="number text-6xl font-sacramento"
        id="nice-counter"
      >123 456 789.12</nice-counter>

      <h2 class="text-xl font-medium">Typical count up counter</h2>
      <nice-counter
        class="number text-6xl font-sacramento"
        id="nice-counter-enter"
        value=""
      >123 456 789.12</nice-counter>

      <div class="buttons mt-8 flex items-center gap-4">
        <button type="button" class="button px-8 py-4 bg-gray-800 text-gray-100 font-semibold hover:bg-gray-900 transition-colors cursor-pointer" id="btn-toggle">Toggle</button>
        <button type="button" class="button px-8 py-4 bg-gray-800 text-gray-100 font-semibold hover:bg-gray-900 transition-colors cursor-pointer" id="btn-set">987-654-321.98</button>
      </div>

      <div class="buttons mt-8 flex items-center gap-4">
        <button type="button" class="button px-8 py-4 bg-gray-800 text-gray-100 font-semibold hover:bg-gray-900 transition-colors cursor-pointer" id="btn-enter">Enter</button>
        <button type="button" class="button px-8 py-4 bg-gray-800 text-gray-100 font-semibold hover:bg-gray-900 transition-colors cursor-pointer" id="btn-reset">Reset</button>
      </div>

      <h2 class="text-xl font-medium mt-8">Duration control (shared)</h2>
      <div class="range flex flex-col items-center">
        <label for="in-duration-range" class="text-xl">Duration</label>
        <input
          type="range"
          id="in-duration-range"
          class="mt-2 w-60"
          min="0"
          max="10000"
          value="1000"
          step="100"
        />
        <input
          type="text"
          id="in-duration-value"
          class="mt-4 w-32 text-center text-xl px-4 py-2 border border-gray-300"
          value="1000"
        />
      </div>
    </div>

    <script type="module" src="./nice-counter.es.js"></script>
    
    <script type="module">
      (function(){

        // ---- Counter with manual control ----

        const counterEl = document.getElementById('nice-counter');
        const toggleEl = document.getElementById('btn-toggle');
        const setEl = document.getElementById('btn-set');

        function onToggleClick() {
          counterEl.value = counterEl.value === null ? '' : null;
        }

        function onSetClick() {
          counterEl.value = '987-654-321.98';
        }

        toggleEl.addEventListener('click', onToggleClick);
        setEl.addEventListener('click', onSetClick);

        // ---- Typical count up counter ----

        const counterEnterEl = document.getElementById('nice-counter-enter');
        const enterEl = document.getElementById('btn-enter');
        const resetEl = document.getElementById('btn-reset');

        function onEnterClick() {
          counterEnterEl.value = null;
        }

        function onResetClick() {
          counterEnterEl.value = '';
        }

        enterEl.addEventListener('click', onEnterClick);
        resetEl.addEventListener('click', onResetClick);

        // ---- Duration control ----

        const durationRangeEl = document.getElementById('in-duration-range');
        const durationValueEl = document.getElementById('in-duration-value');

        function onRangeChange() {
          durationValueEl.value = durationRangeEl.value;
          updateDuration();
        }

        function onValueChange() {
          durationRangeEl.value = durationValueEl.value;
          updateDuration();
        }

        function updateDuration() {
          counterEl.duration = durationRangeEl.value;
          counterEnterEl.duration = durationRangeEl.value;
        }

        durationRangeEl.addEventListener('input', onRangeChange);
        durationValueEl.addEventListener('change', onValueChange);

        // ----

      })();
    </script>

  </body>
</html>
