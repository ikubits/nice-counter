<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=1">
    <title>Docs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
  </head>
  <body>

    <style>
      html {
        min-height: 100%;
      }

      html, body {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-x: clip;
      }

      .content {
        margin: auto;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .number {
        font-size: 54px;
        line-height: 1.2;
        /* font-family: Verdana, Tahoma, sans-serif; */
        font-family: 'Sacramento', cursive;
      }

      .number + .number {
        margin-top: 30px;
      }

      #nice-counter {
        --nc-align-offset: 0.2em;
      }

      .buttons {
        margin-top: 40px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .button {
        background-color: #323232;
        color: #f3f3f3;
        font-size: 20px;
        font-weight: 600;
        line-height: 1;
        padding: 16px 32px;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .button:hover {
        background-color: #424242;
      }

      .range {
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .range label {
        display: block;
        font-size: 20px;
      }
      .range input[type="range"] {
        display: block;
        width: 240px;
        margin-top: 4px;
      }
      .range input[type="text"] {
        display: block;
        width: 120px;
        font-size: 20px;
        text-align: center;
        margin-top: 10px;
      }
    </style>

    <div class="content">
      <span
        class="number"
        id="static"
      >123 456 789.12</span>

      <nice-counter
        class="number"
        id="nice-counter"
      >123 456 789.12</nice-counter>

      <div class="buttons">
        <button class="button" id="toggle">Toggle</button>
        <button class="button" id="set">987 654 321.98</button>
      </div>

      <div class="range">
        <label for="duration">Duration</label>
        <input
          type="range"
          id="duration-range"
          min="0"
          max="10000"
          value="1000"
          step="100"
        />
        <input
          type="text"
          id="duration-value"
          value="1000"
        />
      </div>
    </div>

    <script type="module" src="../dist/nice-counter.es.js"></script>
    <script type="module">
      (function(){
        const counterEl = document.getElementById('nice-counter');
        const toggleEl = document.getElementById('toggle');
        const setEl = document.getElementById('set');
        const durationRangeEl = document.getElementById('duration-range');
        const durationValueEl = document.getElementById('duration-value');

        function onToggleClick() {
          counterEl.value = counterEl.value === null ? '' : null;
        }

        function onSetClick() {
          counterEl.value = '987 654 321+98';
        }

        function onRangeChange() {
          durationValueEl.value = durationRangeEl.value;
          updateDuration();
        }

        function onValueChange() {
          durationRangeEl.value = durationValueEl.value;
          updateDuration();
        }

        function updateDuration() {
          counterEl.duration = durationRangeEl.value;
        }

        toggleEl.addEventListener('click', onToggleClick);
        setEl.addEventListener('click', onSetClick);
        durationRangeEl.addEventListener('input', onRangeChange);
        durationValueEl.addEventListener('change', onValueChange);
      })();
    </script>
  </body>
</html>
